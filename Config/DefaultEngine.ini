+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/Snarehaven")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_Blank",NewGameName="/Script/Snarehaven")

; OSSv2 — 결정 004. Epic = OnlineServicesEOSGS (EAS 없는 게스트 쪽)
[OnlineServices]
DefaultServices=Epic
; 빌드 호환 ID 를 우리가 고정하지 않는다 = 엔진 기본(네트워크 호환 체인지리스트)을 쓴다.
; 두 줄이 없으면 OnlineServices.cpp:86·91 이 시작 때 경고 두 줄을 낸다 (루프#35 3층 로그에서 봄)
bUseBuildIdOverride=false
BuildIdOverride=0

; EOSShared 가 [EOSSDK.Platform.Snarehaven] 절을 찾아 플랫폼을 만든다 (EOSSDKManager.cpp:339·452).
; 그 절(비밀값)은 Config/UserEngine.ini — gitignore. 여기 있는 것은 절 이름뿐이다
[EOSSDK]
DefaultPlatformConfigName=Snarehaven

; iOS 런타임 설정 — ROADMAP M4-06.
;
; 여기 적힌 값은 **전부 사람(감독)이 정한 것**이다 — DESIGN 4.7 "모바일 빌드 설정값" 표(감독 결정 2026-09-20).
; 루프가 만든 숫자·이름은 하나도 없다. 절 이름은 엔진이 쓰는 것 그대로
; (UE_5.8 Engine/Config/BaseEngine.ini:3217 — UBT 가 클래스를 만들지 않고 ini 에서 직접 읽으므로 반드시 이 이름).
;
; **최소 iOS 버전(MinimumiOSVersion)은 일부러 적지 않는다** — 답이 "엔진 5.8 기본값 그대로"(DESIGN 4.7)라,
; 적지 않는 것이 답을 지키는 길이다. 값을 박으면 엔진이 기본을 올릴 때 우리 줄이 옛 값으로 붙잡는다.
; 지금 엔진 기본은 15.0 (UE_5.8 Engine/Config/IOS/IOS_SDK.json MinSoftwareVersion).
;
; 서명은 아래 XcodeProjectSettings 절(개발용 자동 서명, 2026-09-25 사용자 "빌드해"). 배포 인증서·업로드는 여기 없다 — 유료 계정은 사람 몫.
; 아이콘도 이 절이 아니라 Build/IOS/Resources/Graphics/ 의 그림 파일이다 — docs/MOBILE_BUILD.md 표 H 참고.
[/Script/MacTargetPlatform.XcodeProjectSettings]
; 자동 서명 — 팀 = 유료 Apple Developer Program 개인 팀(2026-10-11 결제·10-13 승인). 출시 빌드도 이 팀으로 서명한다.
bUseAutomaticCodeSigning=True
CodeSigningTeam=7W3BAHDG2V
CodeSigningPrefix=com.soilrist
BundleIdentifier=com.soilrist.snarehaven.ios

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
; 번들 ID = 안드로이드 패키지 이름 + `.ios`. 맨 이름은 예전 무료 개인 팀이 잡고 있어 유료 팀에 등록이 안 됐다(2026-10-14 Apple 「not available」).
BundleIdentifier=com.soilrist.snarehaven.ios

; 화면 방향 = 가로만, 세로 없음 (DESIGN 4.7 · 3.3 탑다운 카메라 합격폭이 가로 기준).
; 안드로이드의 SensorLandscape 에 해당하는 iOS 표현은 "가로 두 방향을 다 켜고 세로 두 방향을 끄는 것" 이다
; — 기기를 뒤집으면 따라 돌되 세로로는 안 간다. 엔진 기본과 같은 값이지만 **사람 답이라 우리 파일에 박는다**.
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True

; 1.0 은 아이폰 전용 (감독 🟡 2026-10-11, M94) — 아이패드 스크린샷·아이패드 심사를 뺀다.
bSupportsIPad=False

; 목표 프레임 30fps (DESIGN 4.7). iOS 에서 프레임 상한의 진짜 자리는 이 칸이다 —
; 디바이스 프로파일의 t.MaxFPS(M4-05)와 **같은 답을 두 자리에 적는 것**이지 다른 숫자가 아니다.
FrameRateLock=PUFRL_30

; Info.plist 추가 줄 (2026-10-15 감독). TestFlight 처리 실패 90683 「NSCameraUsageDescription 없음」 — 엔진·EOS 라이브러리가
; 카메라·마이크 API 를 참조만 해도 애플이 사유 문구를 요구한다(게임은 카메라를 쓰지 않음). (수출 규정 NO 는 엔진 기본 plist 에 이미 있음)
AdditionalPlistData=<key>NSCameraUsageDescription</key><string>Snarehaven does not use the camera.</string><key>NSMicrophoneUsageDescription</key><string>Snarehaven does not use the microphone.</string>

; ---- M4-02 안드로이드 설정 절 ------------------------------------------------------------------
; 값은 전부 DESIGN 4.7 표(감독 결정 2026-09-20, 루프#50 질문 답)다 — **새 숫자 0개**.
; 네 값은 엔진 5.8 기본(BaseEngine.ini:3282~3305)과 같지만, **사람 답이라 우리 파일에 박는다**
; (iOS 절 M4-06 과 같은 판단 — 엔진이 기본을 바꿔도 우리 답이 남고, 2층 검사가 어긋남을 잡는다).
;
; **서명 키스토어·스토어 업로드는 여기 없다** — Google Play 개발자 계정은 유료·사람 몫이다(Autonomy 🔴 3).
[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; 패키지 이름 = iOS 번들 ID 와 같은 문자열 (CompanyName=soilrist 를 따른다). 출시 전 사람이 바꿀 수 있다.
PackageName=com.soilrist.snarehaven

; 최소 / 대상 SDK = 26 / 36 (DESIGN 4.7). 대상 36 은 M4-01 이 확인한 platforms/android-36 과 맞다.
MinSDKVersion=26
TargetSDKVersion=36

; 화면 방향 = SensorLandscape — 가로 두 방향만, 세로 없음 (DESIGN 4.7 · 3.3 탑다운 카메라가 가로 기준).
Orientation=SensorLandscape

; arm64 하나만 묶는다 (ROADMAP M4-02). x86-64 는 실기기가 아니라 에뮬레이터용이라 apk 만 키운다.
bBuildForArm64=True
bBuildForX8664=False

; 광고 없음 (2026-10-16 개인정보 라벨 점검). 엔진 기본 bSupportAdMob=true 는 매니페스트에 AdMob AdActivity 줄을 넣는다
; (UE_5.8 UEDeployAndroid.cs:2947). AdMob 앱 ID 가 없어 라이브러리는 이미 빠지지만(AndroidAdvertising_APL.xml:22)
; 매니페스트 줄까지 끊어 "광고 SDK·광고 ID 없음" 답과 빌드를 맞춘다 — docs/STORE_READINESS.md 표 B.
bSupportAdMob=False
