[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; ROADMAP M0-03: 가상 조이스틱. 엔진 기본 터치 인터페이스의 왼쪽 스틱이 Gamepad_LeftX/LeftY 를 내보내고
; IMC_Default 가 그 짝 키(Gamepad_Left2D)를 IA_Move 로 받는다. 레퍼런스처럼 이동 스틱만, 손 떼면 숨김(`setup_touch_interface.py`).
DefaultTouchInterface=/Game/Game/UI/TI_Snare_Joystick.TI_Snare_Joystick
; ROADMAP M1-10a (감독 지시 2026-09-20): 조이스틱은 터치 기기에서만 뜬다(엔진 기본).
; 데스크톱에선 마우스로 조이스틱을 끌 수 없어서 보여 봐야 못 쓴다 — 키보드(W/A/S/D·방향키)로 움직인다.
; 데스크톱에서 조이스틱 자체를 시험할 땐 실행에 -faketouches 를 붙인다 (docs/checks/unreal.md).
bAlwaysShowTouchInterface=False
