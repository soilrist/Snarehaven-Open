; 모바일 품질 설정 — ROADMAP M4-05.
;
; 여기 적힌 숫자는 **하나뿐이고 사람이 정한 것**이다: 모바일 목표 프레임 30fps
; (DESIGN 4.7 "모바일 빌드 설정값" 표 · 감독 결정 2026-09-20 · 근거는 4.2 Mobile Renderer + 4~8인 PVE + 배터리).
; 해상도 배율(r.MobileContentScaleFactor)·품질 단계(sg.*)는 아직 사람 답이 없어 **적지 않는다** —
; 엔진 기본(BaseDeviceProfiles.ini)이 그대로 산다. docs/MOBILE_BUILD.md 표 B 의 "미정" 칸이다.
;
; 절 이름은 엔진이 이미 쓰는 것을 그대로 쓴다 (UE_5.8 Engine/Config/BaseDeviceProfiles.ini
; [IOS DeviceProfile]:347 · [Android DeviceProfile]:987). 새 프로파일을 만들지 않고 `+CVars=` 로
; 줄만 더하는 이유: 엔진이 플랫폼별로 넣어 둔 모바일 설정(HZB·EarlyZPass·오클루전 …)을 지우지 않기 위해서다.
;
; Mobile Renderer 와 Nanite/Lumen 끔(DESIGN 4.2)은 프로파일이 아니라
; Config/DefaultEngine.ini 의 [/Script/Engine.RendererSettings] 에 있다 — 여기서 겹쳐 쓰지 않는다.

[Android DeviceProfile]
+CVars=t.MaxFPS=30

[IOS DeviceProfile]
+CVars=t.MaxFPS=30
